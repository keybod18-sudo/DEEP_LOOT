<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>DEEP LOOT Sprite Preview</title>
  <style>
    body { font-family: system-ui; background:#171d24; color:#fff; padding:20px; }
    .row { display:flex; gap:16px; align-items:end; flex-wrap:wrap; }
    figure { margin:0; padding:12px; background:#222c36; border-radius:8px; }
    img { width:192px; height:192px; object-fit:contain; image-rendering:pixelated; background:#111820; }
    figcaption { margin-top:6px; text-align:center; }
  </style>
</head>
<body>
  <h1>主人公 攻撃5フレーム</h1>
  <div class="row" id="frames"></div>
  <script>
    const root = document.getElementById('frames');
    for (let i=1;i<=5;i++) {
      const n=String(i).padStart(2,'0');
      root.insertAdjacentHTML('beforeend', `<figure><img src="../assets/player/attack/attack_${n}.png"><figcaption>attack_${n}</figcaption></figure>`);
    }
  </script>
</body>
</html>
