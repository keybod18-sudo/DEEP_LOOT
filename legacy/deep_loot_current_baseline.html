<script>
(()=>{
const c=document.getElementById('game'),x=c.getContext('2d');x.imageSmoothingEnabled=false;
const heroImgs=[document.getElementById('hero1'),document.getElementById('hero2'),document.getElementById('hero3'),document.getElementById('hero4'),document.getElementById('hero5')],slimeImg=document.getElementById('slime'),clingImg=document.getElementById('cling'),gobImg=document.getElementById('gob');
const K={}; let p,es,pl,last=0,iv=0,coins=0,dead=false;
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function heroFrame(){
 if(p.attackT<=0) return 0;
 const elapsed = 0.38 - p.attackT;
 return Math.max(0, Math.min(4, Math.floor(elapsed / 0.076)));
}

function reset(){
 p={x:30,y:330,w:22,h:34,vx:0,vy:0,d:1,g:0,hp:100,attackT:0,attackCd:0,attackHit:false};
 pl=[{x:0,y:380,w:736,h:40},{x:60,y:305,w:155,h:14},{x:315,y:245,w:150,h:14},{x:520,y:320,w:150,h:14},{x:350,y:115,w:170,h:14}];
 es=[
  {t:'slime',x:12,y:355,w:34,h:25,d:1,s:'crawl',a:0,cd:.7,hp:30,max:30,vx:.42,vy:0,g:0,dropHit:false},
  {t:'slime',x:410,y:129,w:34,h:25,d:1,s:'cling',a:0,cd:0,hp:30,max:30,vx:0,vy:0,g:0,dropHit:false},
  {t:'goblin',x:190,y:342,w:30,h:38,d:1,s:'walk',a:0,cd:.8,hp:45,max:45,vx:0,vy:0,g:0,hitDone:false},
  {t:'goblin',x:470,y:342,w:30,h:38,d:-1,s:'walk',a:0,cd:.5,hp:45,max:45,vx:0,vy:0,g:0,hitDone:false}
 ];
 coins=0;iv=0;dead=false;hud();
}
function hud(){document.getElementById('hp').textContent=Math.max(0,p.hp|0)+'/100';document.getElementById('gold').textContent=coins}
function floor(o,py){
 o.g=0;
 for(const q of pl) if(o.x+o.w>q.x&&o.x<q.x+q.w&&py+o.h<=q.y&&o.y+o.h>=q.y&&o.vy>=0){o.y=q.y-o.h;o.vy=0;o.g=1}
 o.x=Math.max(0,Math.min(736-o.w,o.x));
}
function hurt(n,sx){if(iv>0||dead)return;p.hp-=n;iv=.7;p.vx=p.x<sx?-4:4;p.vy=-4;if(p.hp<=0){p.hp=0;dead=true}hud()}
function startAttack(){if(dead||p.attackCd>0)return;p.attackT=.38;p.attackCd=.44;p.attackHit=false}
function attackBox(){
 if(p.attackT<=0)return null;
 const f = heroFrame();
 if(f < 2 || f > 3) return null;
 return p.d>0
   ? {x:p.x+p.w-2,y:p.y+2,w:48,h:28}
   : {x:p.x-46,y:p.y+2,w:48,h:28};
}
function player(dt){
 if(dead)return;
 const l=K.a||K.arrowleft,r=K.d||K.arrowright;
 if(l){p.vx-=.55;p.d=-1} if(r){p.vx+=.55;p.d=1} if(!l&&!r)p.vx*=.78;
 p.vx=Math.max(-3.4,Math.min(3.4,p.vx));
 if(K.jump&&p.g){p.vy=-9.2;K.jump=false}
 if(K.attack){startAttack();K.attack=false}
 p.attackT=Math.max(0,p.attackT-dt);p.attackCd=Math.max(0,p.attackCd-dt);
 const py=p.y;p.vy+=.47;p.x+=p.vx;p.y+=p.vy;floor(p,py);
 const ab=attackBox();
 if(ab&&!p.attackHit){
   for(const e of es)if(e.hp>0&&hit(ab,e)){
     e.hp-=10;
     p.attackHit=true;

     // 攻撃を受けた敵を、主人公から離れる方向へノックバック
     if(e.hp>0){
       const kbDir=(e.x+e.w/2 >= p.x+p.w/2)?1:-1;
       e.kb=.22;
       e.vx=kbDir*4.6;
       e.vy=-3.2;
       e.g=0;
       e.a=0;
       e.cd=Math.max(e.cd,.45);
       // ノックバック中に攻撃モーションが暴発しないよう中断
       if(e.t==='slime'){
         if(e.s!=='cling')e.s='crawl';
       }else{
         e.s='walk';
         e.hitDone=false;
       }
     }else{
       coins+=5;
     }
     break;
   }
   hud();
 }
}
function enemy(e,dt){
 if(e.hp<=0)return;
 e.a+=dt;
 e.cd=Math.max(0,e.cd-dt);

 // ノックバック中は通常AIより優先して吹き飛ばす
 if(e.kb>0){
   const py=e.y;
   e.kb=Math.max(0,e.kb-dt);
   e.vy+=.44;
   e.x+=e.vx;
   e.y+=e.vy;
   e.vx*=.88;
   floor(e,py);

   if(e.kb<=0){
     if(e.t==='slime'){
       // 張り付き中に攻撃を受けた場合は落下へ、それ以外は通常移動へ戻す
       if(e.s==='cling'){e.s='drop';e.dropHit=false;}
       else e.s='crawl';
     }else{
       e.s='walk';
       e.hitDone=false;
     }
   }
   return;
 }

 const dx=(p.x+p.w/2)-(e.x+e.w/2),dist=Math.abs(dx);e.d=dx>=0?1:-1;
 if(e.t==='slime'){
   if(e.s==='cling'){
     e.x=410;e.y=129;
     if(Math.abs((p.x+p.w/2)-(e.x+e.w/2))<75 && p.y>e.y+18){e.s='drop';e.a=0;e.vy=0;e.dropHit=false}
   }else if(e.s==='drop'){
     const py=e.y;e.vy+=.62;e.y+=e.vy;floor(e,py);
     if(hit(p,e)&&!e.dropHit){hurt(12,e.x);e.dropHit=true}
     if(e.g){e.s='crawl';e.cd=1;e.a=0;e.vx=e.d*.5}
   }else if(e.s==='pounce'){
     const py=e.y;e.vy+=.5;e.x+=e.vx;e.y+=e.vy;floor(e,py);
     if(hit(p,e))hurt(10,e.x);
     if(e.g&&e.a>.18){e.s='crawl';e.cd=1.1;e.a=0}
   }else{
     e.x+=e.d*.42;const py=e.y;e.vy+=.47;e.y+=e.vy;floor(e,py);
     if(hit(p,e))hurt(8,e.x);
     if(dist<125&&dist>42&&e.cd<=0){e.s='pounce';e.a=0;e.vx=e.d*3.3;e.vy=-6.6;e.g=0}
   }
 }else{
   if(e.s==='walk'){
     e.x+=e.d*.36;const py=e.y;e.vy+=.47;e.y+=e.vy;floor(e,py);
     if(dist<48&&e.cd<=0){e.s='swing';e.a=0;e.cd=1;e.hitDone=false}
     else if(dist>=70&&dist<150&&e.cd<=0){e.s='leap';e.a=0;e.vx=e.d*2.6;e.vy=-7;e.g=0;e.hitDone=false;e.cd=1.4}
   }else if(e.s==='swing'){
     if(e.a>.18&&!e.hitDone){const r=e.d>0?{x:e.x+e.w,y:e.y+4,w:30,h:30}:{x:e.x-30,y:e.y+4,w:30,h:30};if(hit(p,r))hurt(12,e.x);e.hitDone=true}
     if(e.a>.42){e.s='walk';e.a=0}
   }else if(e.s==='leap'){
     const py=e.y;e.vy+=.5;e.x+=e.vx;e.y+=e.vy;floor(e,py);
     if(hit(p,e))hurt(10,e.x);
     if(e.g){e.s='smash';e.a=0;e.hitDone=false}
   }else if(e.s==='smash'){
     if(e.a>.10&&!e.hitDone){const r={x:e.x-18,y:e.y+12,w:e.w+36,h:28};if(hit(p,r))hurt(16,e.x);e.hitDone=true}
     if(e.a>.38){e.s='walk';e.a=0}
   }
 }
}
function update(dt){iv=Math.max(0,iv-dt);player(dt);for(const e of es)enemy(e,dt)}

function drawBg(){
 x.fillStyle='#1c252f';x.fillRect(0,0,736,420);
 // 元画像と同じ、ごく薄い点だけの背景
 x.fillStyle='#2a343e';
 [[27,154],[162,13],[353,8],[547,56],[707,19],[111,266],[581,178],[680,258],[322,220]].forEach(q=>x.fillRect(q[0],q[1],2,2));
 for(const q of pl){
   x.fillStyle='#59636e';x.fillRect(q.x,q.y,q.w,q.h);
   x.fillStyle='#77818b';x.fillRect(q.x,q.y,q.w,3);
   x.fillStyle='#36404a';for(let xx=q.x+30;xx<q.x+q.w;xx+=32)x.fillRect(xx,q.y+4,3,q.h-4);
 }
}
function drawBar(e){/* 復元基準では常時HPバーを出さない */}
function drawSlime(e){
 let img=slimeImg,dw=46,dh=30,dy=e.y+e.h-dh;
 if(e.s==='cling'){img=clingImg;dw=42;dh=28;dy=e.y-1;}
 if(e.s==='drop'){img=clingImg;dw=42;dh=28;dy=e.y-1;}
 if(e.s==='pounce'){dw=50;dh=30;dy=e.y+e.h-dh;}
 x.save();
 if(e.d<0){x.translate(e.x+e.w/2,0);x.scale(-1,1);x.translate(-(e.x+e.w/2),0)}
 x.drawImage(img,e.x-(dw-e.w)/2,dy,dw,dh);
 x.restore();
}
function drawGoblin(e){
 x.save();
 const cx=e.x+e.w/2,cy=e.y+e.h;
 x.translate(cx,cy); if(e.d>0)x.scale(-1,1);
 let rot=0,dy=0;
 if(e.s==='swing')rot=Math.sin(Math.min(1,e.a/.42)*Math.PI)*(-.20);
 if(e.s==='leap'){rot=-.10;dy=-4}
 if(e.s==='smash'){rot=.14;dy=2}
 x.translate(0,dy);x.rotate(rot);
 x.drawImage(gobImg,-34,-67,68,67);
 x.restore();
}
function drawPlayer(){
 const f = heroFrame();
 const img = heroImgs[f];
 const dw = 88, dh = 88;
 const dx = p.x + p.w/2 - dw/2;
 const dy = p.y + p.h - dh + 6;
 x.save();
 if(p.d<0){
   x.translate(p.x+p.w/2,0);
   x.scale(-1,1);
   x.translate(-(p.x+p.w/2),0);
 }
 if(iv>0&&Math.floor(iv*14)%2===0)x.globalAlpha=.35;
 x.drawImage(img, dx, dy, dw, dh);
 x.restore();
}
function draw(){drawBg();for(const e of es)if(e.hp>0){e.t==='slime'?drawSlime(e):drawGoblin(e)}drawPlayer()}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();K[k]=1;if((k==='w'||k===' '||k==='arrowup')&&!e.repeat)K.jump=true;if(k==='j'&&!e.repeat)K.attack=true;if([' ','arrowup','arrowleft','arrowright'].includes(k))e.preventDefault()});
window.addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);
document.getElementById('reset').onclick=reset;
let loaded=0,started=false;const go=()=>{if(started)return;loaded++;if(loaded>=8){started=true;reset();requestAnimationFrame(loop)}};
heroImgs.forEach(img=>img.onload=go);slimeImg.onload=go;clingImg.onload=go;gobImg.onload=go;
heroImgs.forEach(img=>{if(img.complete)go()});if(slimeImg.complete)go();if(clingImg.complete)go();if(gobImg.complete)go();
})();
</script>
